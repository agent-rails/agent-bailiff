version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories:
      - /examples/quickstart
      - /deploy/kubernetes
    schedule:
      interval: weekly
    groups:
      python-base:
        group-by: dependency-name
        patterns: ["python"]
  - package-ecosystem: docker-compose
    directory: /examples/quickstart
    schedule:
      interval: weekly
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
