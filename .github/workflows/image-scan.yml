name: image-scan

on:
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-scan-${{ github.ref }}
  cancel-in-progress: true

env:
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      images: ${{ steps.diff.outputs.images }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" != pull_request ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD -- . \
            ':(exclude)docs' \
            ':(exclude)tests')"
          echo "$changed"
          if [ -n "$changed" ]; then
            echo "images=true" >> "$GITHUB_OUTPUT"
          else
            echo "images=false" >> "$GITHUB_OUTPUT"
          fi

  db:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        run: echo "key=trivy-db-${TRIVY_VERSION}-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: ${{ steps.key.outputs.key }}
      - name: Install trivy
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" > "$RUNNER_TEMP/trivy.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/trivy.sha256"
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
      - name: Download the vulnerability database
        if: steps.cache.outputs.cache-hit != 'true'
        run: '"$RUNNER_TEMP/trivy" image --config /dev/null --download-db-only --cache-dir "$RUNNER_TEMP/trivy-cache" --no-progress'
      - name: Check the vulnerability database is fresh
        run: |
          metadata="$RUNNER_TEMP/trivy-cache/db/metadata.json"
          jq . "$metadata"
          updated="$(jq -er .UpdatedAt "$metadata")"
          test "$(date -u -d "$updated" +%s)" -ge "$(( $(date -u +%s) - DB_MAX_AGE_SECONDS ))"
        env:
          DB_MAX_AGE_SECONDS: 172800

  scan:
    needs: db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quickstart
            build: --file examples/quickstart/Dockerfile --target quickstart
          - image: quickstart-trace
            build: --file examples/quickstart/Dockerfile --target quickstart --build-arg REQUIREMENTS=examples/quickstart/trace-requirements.txt
          - image: webhook
            build: --file deploy/kubernetes/Dockerfile.webhook
          - image: minter
            build: --file deploy/gke/Dockerfile.minter
          - image: live-run
            build: --file examples/live-run/Dockerfile
    env:
      IMAGE: agent-bailiff-${{ matrix.image }}:scan
      LIBZSTD_FLOOR: 1.5.7+dfsg-1+deb13u1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" > "$RUNNER_TEMP/trivy.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/trivy.sha256"
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: ${{ needs.db.outputs.key }}
          fail-on-cache-miss: true
      - name: Build image
        env:
          BUILD: ${{ matrix.build }}
        run: |
          read -ra build <<< "$BUILD"
          docker build "${build[@]}" --tag "$IMAGE" .
      - name: Check libzstd1
        run: |
          status="$(docker run --rm --entrypoint dpkg-query "$IMAGE" --show --showformat='${db:Status-Abbrev} ${Version}\n' libzstd1)"
          echo "libzstd1 $status"
          test "$(wc -l <<< "$status")" -eq 1
          test "${status:0:4}" = "ii  "
          dpkg --compare-versions "${status:4}" ge "$LIBZSTD_FLOOR"
      - name: Scan image
        run: >-
          "$RUNNER_TEMP/trivy" image --config /dev/null --cache-dir "$RUNNER_TEMP/trivy-cache" --skip-db-update --skip-java-db-update
          --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml --show-suppressed
          --exit-code 1 --no-progress "$IMAGE"

  image-scan:
    if: always()
    needs: [changes, db, scan]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULTS" = "success true success success" || test "$RESULTS" = "success false skipped skipped"
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.changes.outputs.images }} ${{ needs.db.result }} ${{ needs.scan.result }}
