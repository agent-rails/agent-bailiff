name: image-scan

on:
  pull_request:
    paths:
      - .github/workflows/image-scan.yml
      - .trivyignore.yaml
      - deploy/gke/Dockerfile.minter
      - deploy/kubernetes/Dockerfile.webhook
      - deploy/kubernetes/webhook-requirements.txt
      - examples/live-run/Dockerfile
      - examples/live-run/package-lock.json
      - examples/live-run/package.json
      - examples/quickstart/Dockerfile
      - examples/quickstart/trace-requirements.txt
      - requirements-ci.txt
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  TRIVY_VERSION: 0.76.2
  TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf

jobs:
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
    steps:
      - id: key
        run: echo "key=trivy-db-${TRIVY_VERSION}-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: ${{ steps.key.outputs.key }}
      - name: Install trivy
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" > "$RUNNER_TEMP/trivy.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/trivy.sha256"
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
      - name: Download the vulnerability database
        if: steps.cache.outputs.cache-hit != 'true'
        run: '"$RUNNER_TEMP/trivy" image --download-db-only --cache-dir "$RUNNER_TEMP/trivy-cache" --no-progress'

  scan:
    needs: db
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: quickstart
            build: --file examples/quickstart/Dockerfile --target quickstart
          - image: quickstart-trace
            build: --file examples/quickstart/Dockerfile --target quickstart --build-arg REQUIREMENTS=examples/quickstart/trace-requirements.txt
          - image: webhook
            build: --file deploy/kubernetes/Dockerfile.webhook
          - image: minter
            build: --file deploy/gke/Dockerfile.minter
          - image: live-run
            build: --file examples/live-run/Dockerfile
    env:
      IMAGE: agent-bailiff-${{ matrix.image }}:scan
      LIBZSTD_FLOOR: 1.5.7+dfsg-1+deb13u1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" > "$RUNNER_TEMP/trivy.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/trivy.sha256"
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/trivy-cache/db
          key: ${{ needs.db.outputs.key }}
          fail-on-cache-miss: true
      - name: Build image
        env:
          BUILD: ${{ matrix.build }}
        run: |
          read -ra build <<< "$BUILD"
          docker build "${build[@]}" --tag "$IMAGE" .
      - name: Check libzstd1
        run: |
          version="$(docker run --rm --entrypoint dpkg-query "$IMAGE" --show --showformat='${Version}' libzstd1)"
          echo "libzstd1 $version"
          dpkg --compare-versions "$version" ge "$LIBZSTD_FLOOR"
      - name: Scan image
        run: >-
          "$RUNNER_TEMP/trivy" image --cache-dir "$RUNNER_TEMP/trivy-cache" --skip-db-update
          --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml --show-suppressed
          --exit-code 1 --no-progress "$IMAGE"

  image-scan:
    if: always()
    needs: scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.scan.result }}
