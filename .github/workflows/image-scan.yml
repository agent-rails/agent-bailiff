name: image-scan

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TRIVY_VERSION: 0.76.2
      TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install trivy
        run: |
          archive="$RUNNER_TEMP/trivy.tar.gz"
          curl -fsSL -o "$archive" "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$archive" > "$RUNNER_TEMP/trivy.sha256"
          sha256sum --check --strict "$RUNNER_TEMP/trivy.sha256"
          tar -xzf "$archive" -C "$RUNNER_TEMP" trivy
      - name: Build images
        run: |
          docker build --file examples/quickstart/Dockerfile --target quickstart --tag agent-bailiff-quickstart:scan .
          docker build --file examples/quickstart/Dockerfile --target quickstart --build-arg REQUIREMENTS=examples/quickstart/trace-requirements.txt --tag agent-bailiff-quickstart-trace:scan .
          docker build --file deploy/kubernetes/Dockerfile.webhook --tag agent-bailiff-webhook:scan .
          docker build --file deploy/gke/Dockerfile.minter --tag agent-bailiff-minter:scan .
          docker build --file examples/live-run/Dockerfile --tag agent-bailiff-live-run:scan .
      - name: Scan images
        run: |
          status=0
          for image in agent-bailiff-quickstart:scan agent-bailiff-quickstart-trace:scan agent-bailiff-webhook:scan agent-bailiff-minter:scan agent-bailiff-live-run:scan; do
            "$RUNNER_TEMP/trivy" image --severity HIGH,CRITICAL --ignore-unfixed --ignorefile .trivyignore.yaml --exit-code 1 --no-progress "$image" || status=1
          done
          exit "$status"
