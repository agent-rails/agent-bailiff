name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: ruff check
      - run: ruff format --check
      - run: mypy
      - run: sh adapters/agentgateway/scripts/fetch_gateway.sh
      - run: sudo useradd --no-create-home --groups "$(id -gn)" bailiff-other
      - run: pytest -q
        env:
          AGENT_BAILIFF_TEST_OTHER_USER: bailiff-other

  install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.3"
          enable-cache: false
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: pytest -q -rs tests/test_install_smoke.py | tee "$RUNNER_TEMP/pytest.out"
        env:
          AGENT_BAILIFF_TEST_INSTALL: "1"
      - run: "! grep -q skipped \"$RUNNER_TEMP/pytest.out\""

  quickstart-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: examples/quickstart/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: sh adapters/agentgateway/scripts/fetch_gateway.sh
      - run: pytest -q -rs tests/test_quickstart_default.py tests/test_adopt_stack.py | tee "$RUNNER_TEMP/pytest.out"
        env:
          AGENT_BAILIFF_TEST_QUICKSTART: "1"
      - run: docker compose --profile gitea --profile spike up --detach --wait
        env:
          UPSTREAM: gitea
      - run: |
          docker compose --profile gitea exec -T gitea gitea admin user create --username agentops \
            --password "$(openssl rand -hex 16)" --email agentops@example.invalid --must-change-password=false
          umask 077
          docker compose --profile gitea exec -T gitea gitea admin user generate-access-token --username agentops \
            --token-name quickstart --raw --scopes read:user > "$RUNNER_TEMP/gitea-token"
      - run: pytest -q -rs tests/test_quickstart_spike.py | tee --append "$RUNNER_TEMP/pytest.out"
        env:
          AGENT_BAILIFF_TEST_GITEA_MCP_URL: http://127.0.0.1:18080/mcp
          AGENT_BAILIFF_TEST_GITEA_TOKEN_FILE: ${{ runner.temp }}/gitea-token
          AGENT_BAILIFF_TEST_GITEA_USER: agentops
      - run: pytest -q -rs tests/test_quickstart_stack.py tests/test_quickstart.py tests/test_quickstart_trace.py tests/test_quickstart_canary.py | tee --append "$RUNNER_TEMP/pytest.out"
        env:
          AGENT_BAILIFF_TEST_QUICKSTART: "1"
      - run: pytest -q -rs tests/test_quickstart_load.py | tee --append "$RUNNER_TEMP/pytest.out"
        env:
          AGENT_BAILIFF_TEST_QUICKSTART: "1"
          AGENT_BAILIFF_TEST_QUICKSTART_LOAD: "1"
      - run: cat benchmarks/quickstart-*.json
      - run: "! grep -q skipped \"$RUNNER_TEMP/pytest.out\""
      - if: always()
        run: docker compose --profile "*" down --volumes --remove-orphans
        env:
          UPSTREAM: gitea

  live-run-image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: >-
          pytest -q -rs tests/test_live_run_container.py
          --deselect tests/test_live_run_container.py::test_kubectl_reads_the_mounted_kubeconfig
          --deselect tests/test_live_run_container.py::test_docker_stop_runs_teardown
          | tee "$RUNNER_TEMP/pytest.out"
        env:
          AGENT_BAILIFF_TEST_LIVE_RUN_IMAGE: "1"
      - run: "! grep -q skipped \"$RUNNER_TEMP/pytest.out\""
