name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: sh adapters/agentgateway/scripts/fetch_proto.sh
      - run: ruff check
      - run: ruff format --check
      - run: mypy
      - run: sh adapters/agentgateway/scripts/fetch_gateway.sh
      - run: sudo useradd --no-create-home --groups "$(id -gn)" bailiff-other
      - run: pytest -q
        env:
          AGENT_BAILIFF_TEST_OTHER_USER: bailiff-other

  quickstart-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: examples/quickstart/compose.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m pip check
      - run: sh adapters/agentgateway/scripts/fetch_proto.sh
      - run: sh adapters/agentgateway/scripts/fetch_gateway.sh
      - run: docker compose up --detach --wait
      - run: |
          docker compose exec -T gitea gitea admin user create --username agentops \
            --password "$(openssl rand -hex 16)" --email agentops@example.invalid --must-change-password=false
          umask 077
          docker compose exec -T gitea gitea admin user generate-access-token --username agentops \
            --token-name quickstart --raw --scopes read:user > "$RUNNER_TEMP/gitea-token"
      - run: pytest -q -rs tests/test_quickstart_spike.py | tee "$RUNNER_TEMP/pytest.out"
        env:
          AGENT_BAILIFF_TEST_GITEA_MCP_URL: http://127.0.0.1:18080/mcp
          AGENT_BAILIFF_TEST_GITEA_TOKEN_FILE: ${{ runner.temp }}/gitea-token
          AGENT_BAILIFF_TEST_GITEA_USER: agentops
      - run: "! grep -q skipped \"$RUNNER_TEMP/pytest.out\""
      - if: always()
        run: docker compose down --volumes
