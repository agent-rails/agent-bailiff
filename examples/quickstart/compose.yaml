name: bailiff-quickstart

x-bailiff: &bailiff
  image: agent-bailiff-quickstart:dev
  build:
    context: ../..
    dockerfile: examples/quickstart/Dockerfile
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-once: &once
  restart: "no"

x-offline: &offline
  network_mode: none

services:
  gitea:
    image: gitea/gitea:1.25-rootless@sha256:be0b89adf2fc8657df508303d919c3be33e6413605882919f702177d62960c9a
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://gitea:3000/
      GITEA__service__DISABLE_REGISTRATION: "true"
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
    networks: [upstream]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 2s
      timeout: 2s
      retries: 30

  gitea-mcp:
    image: docker.gitea.com/gitea-mcp-server:1.13.0@sha256:2daf12dfa853bfc21f6f4754bca2612957c2acbc4288b03ddcce81e37f18ea18
    command: ["/app/gitea-mcp", "-transport", "http", "-host", "http://gitea:3000", "-port", "8080"]
    ports:
      - "127.0.0.1:${GITEA_MCP_PORT:-18080}:8080"
    networks: [upstream]
    depends_on:
      gitea:
        condition: service_healthy

  gitea-secret:
    <<: [*bailiff, *once, *offline]
    user: "10003:10003"
    group_add: ["20004"]
    command: ["/app/quickstart/bootstrap.py", "admin-secret"]
    volumes:
      - gitea-admin:/var/lib/bailiff/gitea-admin

  gitea-admin:
    <<: *once
    image: gitea/gitea:1.25-rootless@sha256:be0b89adf2fc8657df508303d919c3be33e6413605882919f702177d62960c9a
    user: "1000:1000"
    group_add: ["20004"]
    network_mode: none
    command:
      - sh
      - -ec
      - |
        password=$$(cat /var/lib/bailiff/gitea-admin/password)
        if gitea admin user list --admin | awk 'NR > 1 { print $$2 }' | grep -qx quickstart-admin; then
          gitea admin user change-password --username quickstart-admin --password "$$password" --must-change-password=false
        else
          gitea admin user create --admin --username quickstart-admin --email quickstart-admin@example.invalid --password "$$password" --must-change-password=false
        fi
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - gitea-admin:/var/lib/bailiff/gitea-admin:ro
    depends_on:
      gitea:
        condition: service_healthy
      gitea-secret:
        condition: service_completed_successfully

  issuer-init:
    <<: [*bailiff, *once, *offline]
    user: "10007:10007"
    command: ["/app/quickstart/bootstrap.py", "issuer"]
    volumes:
      - issuer-data:/var/lib/bailiff/issuer
      - pins:/pins

  decide-init:
    <<: [*bailiff, *once, *offline]
    user: "10002:20001"
    command: ["/app/quickstart/bootstrap.py", "decide"]
    volumes:
      - decide-data:/var/lib/bailiff/decide
      - ledger:/var/lib/bailiff/ledger
      - pins:/pins
    depends_on:
      issuer-init:
        condition: service_completed_successfully

  custodian-init:
    <<: [*bailiff, *once, *offline]
    user: "10003:10003"
    command: ["/app/quickstart/bootstrap.py", "custodian"]
    volumes:
      - custodian-data:/var/lib/bailiff/custodian
      - pins:/pins
    depends_on:
      decide-init:
        condition: service_completed_successfully

  control-init:
    <<: [*bailiff, *once, *offline]
    user: "10002:20001"
    command: ["/app/quickstart/bootstrap.py", "control"]
    volumes:
      - control-data:/var/lib/bailiff/control
      - decide-data:/var/lib/bailiff/decide
      - pins:/pins
    depends_on:
      custodian-init:
        condition: service_completed_successfully

  docket-init:
    <<: [*bailiff, *once, *offline]
    user: "10001:10001"
    group_add: ["20000", "20003"]
    command: ["/app/quickstart/bootstrap.py", "docket"]
    volumes:
      - docket-data:/var/lib/bailiff/docket
      - pins:/pins:ro
    depends_on:
      control-init:
        condition: service_completed_successfully

  bootstrap:
    <<: [*bailiff, *once]
    user: "10003:10003"
    group_add: ["20004"]
    networks: [upstream]
    command: ["/app/quickstart/bootstrap.py", "gitea"]
    volumes:
      - custodian-data:/var/lib/bailiff/custodian
      - gitea-admin:/var/lib/bailiff/gitea-admin:ro
    depends_on:
      gitea-admin:
        condition: service_completed_successfully
      custodian-init:
        condition: service_completed_successfully

  docket:
    <<: [*bailiff, *offline]
    user: "10001:10001"
    group_add: ["20000", "20003"]
    command: ["-m", "agent_bailiff.cli", "docket", "run", "--config", "/var/lib/bailiff/docket/config.json"]
    volumes:
      - docket-data:/var/lib/bailiff/docket
      - docket-run:/run/bailiff/docket
    healthcheck: &socket-health
      test: ["CMD", "python", "-c", "import stat, os, sys; sys.exit(not stat.S_ISSOCK(os.lstat(sys.argv[1]).st_mode))", "/run/bailiff/docket/docket.sock"]
      interval: 1s
      timeout: 2s
      retries: 30
    depends_on:
      docket-init:
        condition: service_completed_successfully

  decide:
    <<: [*bailiff, *offline]
    user: "10002:20001"
    group_add: ["20000", "20002"]
    command: ["-m", "agent_bailiff.cli", "decide", "run", "--config", "/var/lib/bailiff/decide/config.json"]
    volumes:
      - decide-data:/var/lib/bailiff/decide
      - ledger:/var/lib/bailiff/ledger
      - docket-run:/run/bailiff/docket
      - decide-run:/run/bailiff/decide
    healthcheck:
      <<: *socket-health
      test: ["CMD", "python", "-c", "import stat, os, sys; sys.exit(not stat.S_ISSOCK(os.lstat(sys.argv[1]).st_mode))", "/run/bailiff/decide/decide.sock"]
    depends_on:
      docket:
        condition: service_healthy
      control-init:
        condition: service_completed_successfully

  custodian:
    <<: [*bailiff, *offline]
    user: "10003:10003"
    group_add: ["20000", "20001", "20002"]
    command: ["-m", "agent_bailiff.cli", "custodian", "run", "--config", "/var/lib/bailiff/custodian/config.json"]
    volumes:
      - custodian-data:/var/lib/bailiff/custodian
      - ledger:/var/lib/bailiff/ledger
      - docket-run:/run/bailiff/docket
      - custodian-run:/run/bailiff/custodian
    healthcheck:
      <<: *socket-health
      test: ["CMD", "python", "-c", "import stat, os, sys; sys.exit(not stat.S_ISSOCK(os.lstat(sys.argv[1]).st_mode))", "/run/bailiff/custodian/custodian.sock"]
    depends_on:
      docket:
        condition: service_healthy
      decide:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully

  gateway-check:
    <<: [*bailiff, *once, *offline]
    user: "10003:10003"
    command:
      - -m
      - agent_bailiff.adapters.agentgateway
      - check-config
      - --gateway-config
      - /etc/bailiff/gateway.json
      - --routes
      - /var/lib/bailiff/custodian/routes.json
      - --bindings
      - /var/lib/bailiff/custodian/bindings.json
      - --decide-socket
      - /run/bailiff/decide/decide.sock
      - --custodian-socket
      - /run/bailiff/custodian/custodian.sock
    configs:
      - source: gateway
        target: /etc/bailiff/gateway.json
    volumes:
      - custodian-data:/var/lib/bailiff/custodian:ro
    depends_on:
      custodian-init:
        condition: service_completed_successfully

  gateway:
    image: ghcr.io/agentgateway/agentgateway:v1.7.0@sha256:60216aafb03d37f94e952ff3d51d2f630a65b10ecaebdc0a864882f92610c45b
    user: "10004:10004"
    group_add: ["20002"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    command: ["-f", "/etc/bailiff/gateway.json"]
    configs:
      - source: gateway
        target: /etc/bailiff/gateway.json
    volumes:
      - decide-run:/run/bailiff/decide
      - custodian-run:/run/bailiff/custodian
    networks: [edge, upstream]
    depends_on:
      gateway-check:
        condition: service_completed_successfully
      decide:
        condition: service_healthy
      custodian:
        condition: service_healthy
      gitea-mcp:
        condition: service_started

  reader:
    <<: [*bailiff, *offline]
    profiles: [operator]
    user: "10005:10005"
    group_add: ["20003"]
    entrypoint: ["python", "-m", "agent_bailiff.cli", "docket", "verify", "--docket", "/var/lib/bailiff/docket/docket.log",
                 "--pin", "/pins/decide/decide.json", "--pin", "/pins/custodian/custodian.json",
                 "--pin", "/pins/control/control.json"]
    volumes:
      - docket-data:/var/lib/bailiff/docket:ro
      - pins:/pins:ro

  control:
    <<: [*bailiff, *offline]
    profiles: [operator]
    user: "10002:20001"
    group_add: ["20000"]
    entrypoint: ["python", "-m", "agent_bailiff.cli", "control"]
    volumes:
      - control-data:/var/lib/bailiff/control
      - decide-data:/var/lib/bailiff/decide:ro
      - ledger:/var/lib/bailiff/ledger
      - docket-run:/run/bailiff/docket

configs:
  gateway:
    file: ./gateway.json

networks:
  edge:
    internal: true
  upstream: {}

volumes:
  gitea-data: {}
  gitea-config: {}
  gitea-admin: {}
  pins: {}
  issuer-data: {}
  decide-data: {}
  custodian-data: {}
  control-data: {}
  docket-data: {}
  ledger: {}
  docket-run: {}
  decide-run: {}
  custodian-run: {}
